# Tag v1.2.3 pushen -> testen, Universal-App bauen, GitHub-Release mit zeyt-1.2.3.zip anlegen
# und den Cask in oberbichler/homebrew-tap aktualisieren (wenn das Secret HOMEBREW_TAP_TOKEN gesetzt ist:
# Fine-grained Token mit "Contents: Read and write" nur für oberbichler/homebrew-tap).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: ./test.sh

      - name: Build
        run: ./build.sh release "${GITHUB_REF_NAME#v}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/zeyt-*.zip \
            --title "zeyt ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Update Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/oberbichler/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp dist/zeyt.rb tap/Casks/zeyt.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/zeyt.rb
          git commit -m "zeyt ${GITHUB_REF_NAME#v}"
          git push

      - name: Cask (ohne HOMEBREW_TAP_TOKEN von Hand übernehmen)
        if: env.TAP_TOKEN == ''
        run: cat dist/zeyt.rb
